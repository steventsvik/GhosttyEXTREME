<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor</title>
<link rel="stylesheet" href="codicons/codicon.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="workbench">
  <aside id="explorer">
    <div class="pane-title">
      <span>EXPLORER</span>
      <span class="pane-actions">
        <i class="codicon codicon-refresh" id="refresh" title="Refresh Explorer"></i>
        <i class="codicon codicon-collapse-all" id="collapse" title="Collapse Folders"></i>
      </span>
    </div>
    <div class="section-title"><i class="codicon codicon-chevron-down"></i><span id="root-name">NO FOLDER</span></div>
    <div id="tree" tabindex="0"></div>
  </aside>
  <div id="sash"></div>
  <main id="editor-part">
    <div id="top-bar">
      <i class="codicon codicon-layout-sidebar-left" id="toggle-explorer" title="Hide Explorer (⌘B)"></i>
      <div id="pov-toggle" title="AI POV: watch everything the agent does"><span class="pov-toggle-eye"></span>AI POV</div>
      <div id="tabs"></div>
      <div id="panel-close" title="Close the code editor (⌃⌘E)"><i class="codicon codicon-close"></i><span>CLOSE</span></div>
    </div>
    <div id="breadcrumbs"></div>
    <div id="editor"></div>
    <div id="agent-sash"></div>
    <section id="agent" class="empty">
      <div class="agent-header">
        <span id="agent-logo" class="agent-logo"></span>
        <span id="agent-name">AGENT</span>
        <span id="agent-pill" class="pill"></span>
        <span id="agent-task"></span>
        <span class="agent-actions">
          <i class="codicon codicon-eye" id="agent-follow" title="Follow the agent: open files it edits"></i>
          <i class="codicon codicon-clear-all" id="agent-clear" title="Clear"></i>
          <i class="codicon codicon-chevron-down" id="agent-toggle" title="Hide panel"></i>
        </span>
      </div>
      <div id="agent-feed"><div class="agent-empty">Run <code>claude</code> or <code>codex</code> in this terminal to see what it's doing here, live.</div></div>
    </section>
    <div id="watermark">
      <div class="watermark-inner">
        <div class="wm-row"><span>Go to File</span><kbd>⌘</kbd><kbd>P</kbd></div>
        <div class="wm-row"><span>Show All Commands</span><kbd>F1</kbd></div>
        <div class="wm-row"><span>Find</span><kbd>⌘</kbd><kbd>F</kbd></div>
        <div class="wm-row"><span>Toggle Explorer</span><kbd>⌘</kbd><kbd>B</kbd></div>
        <div class="wm-row"><span>Close Editor Panel</span><kbd>⌃</kbd><kbd>⌘</kbd><kbd>E</kbd></div>
      </div>
    </div>
  </main>
</div>
<footer id="statusbar">
  <div class="left"><span id="sb-branch"></span></div>
  <div class="right">
    <span id="sb-position"></span><span id="sb-indent"></span><span id="sb-eol"></span><span id="sb-language"></span>
  </div>
</footer>
<div id="quickopen" class="hidden">
  <input id="qo-input" placeholder="Search files by name" spellcheck="false" autocomplete="off">
  <div id="qo-list"></div>
</div>
<script src="vs/loader.js"></script>
<script src="app.js"></script>
<script src="pov.js"></script>
</body>
</html>
